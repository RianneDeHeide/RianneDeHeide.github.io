  html: '10 October: I was awarded the 2023 Cor Baayen Early Career Researcher Award (<a href="https://ercim-news.ercim.eu/en135/joint-ercim-actions/2023-cor-baayen-early-career-researcher-award-for-rianne-de-heide"
