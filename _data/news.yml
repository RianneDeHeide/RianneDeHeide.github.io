- year: 2026
  html: '30 August - 2 September: I teach <i>E-values and Multiple Testing</i> at the <a href="https://statistique.cuso.ch/?L=0&amp;id=2688&amp;tx_displaycontroller%5BshowUid%5D=8428" rel="noopener" target="_blank">CUSO
    Summer School 2026</a> in Anzère, Switzerland.'
- year: 2026
  html: '20 August: Our paper <i>Carefree multiple testing with e-processes</i>, with Yury Tavyrikov and Jelle Goeman, has been published in the <i>Electronic Journal of Statistics</i> (<a href="https://projecteuclid.org/journals/electronic-journal-of-statistics/volume-20/issue-2/Carefree-multiple-testing-with-e-processes/10.1214/26-EJS2546.full"
    target="_blank" rel="noopener">paper</a>).'
- year: 2026
  html: '6-9 July: I speak at the <a href="https://ims2026.github.io/IMS2026/" rel="noopener" target="_blank">IMS Annual Meeting 2026</a> in Salzburg.'
- year: 2026
  html: '29 June - 3 July: <a href="https://savi-conference.github.io/2026/" rel="noopener" target="_blank">SAVI 2026</a> will take place at the University of Twente! <a href="https://wouterkoolen.info"
    rel="noopener" target="_blank">Wouter Koolen</a> and I are the local organisers.'
- year: 2026
  html: '1 June: I speak at the <a href="https://www.nki.nl" rel="noopener" target="_blank">Netherlands Cancer Institute</a>.'
- year: 2026
  html: '27-30 April: I am invited for a research visit to the <a href="https://www.kuleuven.be/" rel="noopener" target="_blank">KU Leuven</a>.'
- year: 2026
  html: '10 April: I speak at <a href="https://www.betapartners.nl/leve-de-wiskunde-2026/" rel="noopener" target="_blank">Leve de Wiskunde!</a>, a conference for Dutch math teachers in Amsterdam.'
- year: 2026
  html: '9 April: I am appointed as a member of the <a href="https://www.nwo.nl/en/round-table-mathematics" rel="noopener" target="_blank">Round Table Mathematics</a>.'
- year: 2026
  html: '7-8 April: I speak at the <a href="https://bms.ulb.ac.be/conferences/bms-kwg-sml-joint-meeting/" rel="noopener" target="_blank">BeNeLux Mathematical Congress</a> in Antwerp.'
- year: 2026
  html: '16 February: welcome to visiting PhD student Ivan Melev from LMU Munich, who is going to join our group for a couple of months.'
- year: 2026
  html: 'February-April: I teach Medical Statistics (Medische Statistiek) to students in the Bachelor Gezondheidswetenschappen.'
- year: 2026
  html: '30 January: I am plenary speaker for the event <a href="https://platformwiskunde.nl/a-phd-is-that-for-me/" rel="noopener" target="_blank"><i>A PhD, is that for me?</i></a>, organised by KWG in
    Amsterdam.'
- year: 2026
  html: '1 January: I am appointed as Associate Editor of JRSS-B.'
- year: 2026
  html: '1 January: I am appointed as a member of the <a href="https://euromathsoc.org/EMYA" rel="noopener" target="_blank">EMS Young Academy</a>.'
- year: 2025
  html: 'November: I am invited to the <a href="https://www.upf.edu/en/" rel="noopener" target="_blank">Pompeu Fabra University</a> in Barcelona, where I will talk about e-values and spend the rest of the
    week writing a book.'
- year: 2025
  html: 'October: I talk at the <a href="https://www.isi-next.org/conferences/isi-wsc2025/" rel="noopener" target="_blank">World Statistics Congress</a> in The Hague, and I will receive the 2025 Bernoulli
    Society New Researcher Award.'
- year: 2025
  html: 'September 8: Welcome to my new PhD student Aurèle Mingam, funded by the NWO M2 grant and co-supervised with Jelle Goeman.'
- year: 2025
  html: 'September 1: Welcome to my new PhD student Rovanos Tsafack Nzanguim, funded by the NWO M2 grant and co-supervised with Jelle Goeman.'
- year: 2025
  html: 'September 1: The University of Twente promoted me to Associate Professor (Universitair Hoofddocent).'
- year: 2025
  html: 'July 15-18: I visit the <a href="https://isipta25.sipta.org" rel="noopener" target="_blank">ISIPTA</a> conference in Bielefeld.'
- year: 2025
  html: 'July 11: I give a talk at the Department of Statistics of Athens University of Economics and Business'
- year: 2025
  html: 'June 8: I give a tutorial on e-values at <a href="https://obayes25.aueb.gr" rel="noopener" target="_blank">O''Bayes</a> in Athens.'
- year: 2025
  html: 'June 6: Our interdisciplinary paper with mathematician and theologian Evy Beijen has been published: <a href="https://tidsskrift.dk/hiphilnovum/article/view/147482" rel="noopener" target="_blank">link
    to the paper</a>.'
- year: 2025
  html: 'May 13: I''m invited to the Ruhr University Bochum for a research visit and giving a talk on e-values.'
- year: 2025
  html: 'March 10: I talk in the Delft Seminar in Probability and Statistics.'
- year: 2025
  html: 'March 1: we launched the <a href="https://sites.google.com/view/kindness-and-excellence" rel="noopener" target="_blank">website</a> for the Kindness and Excellence initiative.'
- year: 2025
  html: 'February 18: Jelle Goeman and I were awarded an NWO M2 grant of €742,708 for our project <i>Flexible and user-adaptive statistical inference</i>. The funds allow us to employ two PhD students,
    who will be co-supervised by both of us, and a scientific programmer. (<a href="https://www.utwente.nl/en/about-us/news-events-ceremonies/news/2025/2/137946/rianne-de-heide-receives-a-substantial-grant-for-developing-a-flexible-statistical-method"
    rel="noopener" target="_blank">UT news article</a>; <a href="https://www.nwo.nl/en/news/seventeen-innovative-research-projects-awarded-through-open-competition-domain-science-m-programme" rel="noopener"
    target="_blank">NWO announcement</a>)'
- year: 2025
  html: '12 February: UToday wrote an article about our Kindness and Excellence in Academia initiative (<a href="https://www.utoday.nl/news/75198/ut-researcher-starts-initiative-for-kind-academics" rel="noopener"
    target="_blank">news article UToday</a>)'
- year: 2024
  html: 'December 16: I talk about e-processes and multiple testing at the 2024 IMS International Conference on Statistics and Data Science (ICSDS) in Nice, France.'
- year: 2024
  html: 'November 25: I talk about e-values with domain experts at the Netherlands Cancer Institute (NKI)'
