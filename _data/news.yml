  html: 'January 24: We presented our <a href="https://arxiv.org/abs/1906.07801" rel="noopener" target="_blank">Safe Testing</a> paper at the <a href="https://rss.org.uk/training-events/events/discussion-papers/"
    rel="noopener" target="_blank">discussion meeting of the Royal Statistical Society</a> in London. <a href="__BASEURL__/RSS.jpeg" rel="noopener" target="_blank">picture</a>'
