  html: 'November 8: I organize e-Day, a meetup for Dutch e-value researchers.'
- year: 2024
  html: 'November 1: Welcome to my new PhD student <a href="https://fabian.damken.net" rel="noopener" target="_blank">Fabian Damken</a>!'
- year: 2024
  html: 'October: Our paper about e-statistics, group invariance and any-time valid testing is published at the Annals of Statistics (<a href="__BASEURL__/AOS2394.pdf" rel="noopener" target="_blank">PDF</a>).'
- year: 2024
  html: 'September: I started an initiative for Kindness and Excellence in academia. More will follow soon…'
- year: 2024
  html: 'September: I wrote a column for <a href="https://www.nieuwarchief.nl" rel="noopener" target="_blank">NAW</a> about my view on statistics as a field and where it should go: a paradigm shift (<a
    href="__BASEURL__/naw5-2024-25-3-183.pdf" rel="noopener" target="_blank">PDF</a>).'
- year: 2024
  html: 'September: I wrote a piece on e-values for <a href="https://www.nieuwarchief.nl" rel="noopener" target="_blank">NAW</a> (<a href="__BASEURL__/naw5-2024-25-3-150.pdf" rel="noopener" target="_blank">PDF</a>).'
- year: 2024
  html: 'Fall 2024: I teach an MSc course on Statistical Learning.'
- year: 2024
  html: 'September 1: I start my new position at the University of Twente.'
- year: 2024
  html: 'June 25: I give a talk at <a href="https://www.zorginstituutnederland.nl" rel="noopener" target="_blank">Zorginstituut Nederland</a> about e-values, - I think this is my first e-value talk in Dutch!'
- year: 2024
  html: 'June 25: I give a talk at the Epidemiology group of the LUMC (<a href="https://www.lumc.nl/afdelingen/klinische-epidemiologie/" rel="noopener" target="_blank">website</a>) about e-values.'
- year: 2024
  html: 'June 24: I give a talk at RIVM (<a href="https://www.rivm.nl" rel="noopener" target="_blank">Rijksinstituut voor Volksgezondheid en Milieu</a>) about e-values.'
- year: 2024
  html: 'May 5-9: I had a fantastic week with fellow e-value enthusiasts in <a href="https://www.mfo.de/scientific-program/leibniz-network-mms/mms-activities-in-2024" rel="noopener" target="_blank">Oberwolfach</a>.'
- year: 2024
  html: 'April 26: Together with Jelle Goeman we submitted a grant proposal (M2) to NWO.'
- year: 2024
  html: 'Spring: There were several interviews with me in (national) newspapers and magazines: NAW (<a href="__BASEURL__/NAW.pdf" rel="noopener" target="_blank">interview PDF</a>), NRC (<a href="__BASEURL__/NRC.jpg"
    rel="noopener" target="_blank">scan</a>, <a href="https://www.nrc.nl/nieuws/2024/02/11/verkeerd-begrip-van-statistiek-leidt-tot-foute-wetenschap-de-p-waarde-is-dood-leve-de-e-waarde-a4189494" rel="noopener"
    target="_blank">NRC article</a>), New Scientist (<a href="__BASEURL__/NewScientistText.jpeg" rel="noopener" target="_blank">scan</a>), and Ad Valvas (<a href="https://advalvas.vu.nl/wetenschap-onderwijs/betekent-de-doorbraak-van-deze-wiskundige-het-einde-van-de-p-waarde/"
    rel="noopener" target="_blank">article</a>, <a href="__BASEURL__/AdvalvasInterviewSafeTesting.pdf" rel="noopener" target="_blank">PDF copy</a>).'
- year: 2024
  html: 'February 12: An interview with me about e-values appeared in NRC: <a href="__BASEURL__/NRC.jpg" rel="noopener" target="_blank">scan</a>, <a href="https://www.nrc.nl/nieuws/2024/02/11/verkeerd-begrip-van-statistiek-leidt-tot-foute-wetenschap-de-p-waarde-is-dood-leve-de-e-waarde-a4189494"
