  html: '20 May: I spoke about Bayesian best-arm identification in the <a href="https://uni-tuebingen.de/fakultaeten/mathematisch-naturwissenschaftliche-fakultaet/fachbereiche/informatik/lehrstuehle/decision-making/research-colloquium/"
