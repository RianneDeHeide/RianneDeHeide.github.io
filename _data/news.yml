  html: 'September 24: I organized the Junior Math Olympiad (<a href="https://vu.nl/nl/over-de-vu/faculteiten/faculteit-der-betawetenschappen/meer-over/junior-wiskunde-olympiade-beta" rel="noopener" target="_blank">JWO</a>)
